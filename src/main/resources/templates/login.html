<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head
    th:replace="~{common/head :: head_fragment(title = 'ログイン', scripts = ~{::script}, links = ~{::link})}"
  ></head>
  <body>
    <header th:replace="~{common/header}"></header>

    <div class="container s-height">
      <h1 class="text-center custom-caption">ログイン</h1>
      <form
        th:action="@{/login}"
        th:method="post">
        <div class="form-group custom-form-group">
          <label class="custom-label">メールアドレス</label>
          <input type="text" class="form-control custom-form" id ="email" name="email"/>
        </div>
        <div class="form-group custom-form-group">
          <label class="custom-label">パスワード</label>
          <input type="password" class="form-control custom-form" id="password" name="password"/>
          <div th:if="${error}" class="text-danger custom-text-danger" th:text="${error}"></div>
        </div>
        <!-- CSRF対策token発行して不正postから守る -->
        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
        <div class="text-center">
          <input type="submit" value="ログインする" class="btn custom-color custom-login-signin-btn" />
        </div>
        <div class="text-center">
          <a href="/signin" class="btn custom-color custom-login-signin-btn signin-m" >新規登録する</a>
        </div>
      </form>
    </div>
    <footer th:replace="~{common/footer}"><footer>
  </body>
</html>
